# Serves the dashboard and proxies the API.
#  /api/...            -> one node at a time (the same node while it is up), failing over to the others.
#                         Cluster-wide views and writes work from any node, but FaultLab runs are kept on
#                         the node that ran them, so the dashboard must keep talking to the same node.
#  /nodes/nX/api/...   -> exactly node nX (node-local data such as FaultLab runs and per-node events)
#
# The nodes have fixed addresses on the compose network (docker-compose.yml). Container names resolved
# once at start-up go stale when containers restart (observed: node1 and node2 swapped addresses), and
# nginx would not even start while a node's name did not resolve.
#
# max_fails=0: never mark a node "down". With marking, failed connects while the nodes start (or while
# one is stopped) marked every node down at once, and nginx answered 502 "no live upstreams" for the
# next seconds although two nodes were serving. A refused connect costs nothing and an unreachable node
# at most proxy_connect_timeout; proxy_next_upstream then tries the next node. nginx does not retry
# non-idempotent requests (POST) on another node once they were sent.
upstream quorumdb {
    hash "quorumdb";   # constant key: every request picks the same node first; retries go to the others
    server 10.89.73.11:8080 max_fails=0;
    server 10.89.73.12:8080 max_fails=0;
    server 10.89.73.13:8080 max_fails=0;
}

map $node_id $node_addr {
    n1 10.89.73.11;
    n2 10.89.73.12;
    n3 10.89.73.13;
    default "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 5m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Reads may be retried on another node after any failure. Writes (PUT, DELETE, POST, ...) only after a
    # connection error: a write that timed out may have committed, and resending it elsewhere could turn
    # that unknown outcome into a misleading answer (for example 409 for a compare-and-set that succeeded).
    # Clients that need exactly-once writes send X-Client-Id and X-Request-Seq.
    location /api/ {
        error_page 418 = @api_write;
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
            return 418;
        }
        proxy_pass http://quorumdb;
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 3;
        proxy_connect_timeout 1s;
        proxy_read_timeout 120s;
    }

    location @api_write {
        proxy_pass http://quorumdb;
        proxy_next_upstream error;
        proxy_next_upstream_tries 3;
        proxy_connect_timeout 1s;
        proxy_read_timeout 120s;
    }

    location ~ ^/nodes/(?<node_id>n[0-9]+)/(?<node_path>api/.*)$ {
        if ($node_addr = "") {
            return 404;
        }
        proxy_pass http://$node_addr:8080/$node_path$is_args$args;
        proxy_connect_timeout 1s;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
