// Wire format of QuorumDB's node-to-node protocol.
//
// Every Raft message, request or reply, is sent as its own one-way Envelope via the unary
// Deliver RPC. The Ack only means "received by the transport"; Raft-level answers travel back
// as separate Envelopes. Raft itself tolerates loss, duplication and reordering, so the
// transport never retries.
syntax = "proto3";

package quorumdb.raft.v1;

option java_package = "io.quorumdb.rpc";
option java_multiple_files = true;
option java_outer_classname = "RaftProto";

message Entry {
  uint64 index = 1;
  uint64 term = 2;
  uint32 type = 3;   // 0 = NOOP, 1 = COMMAND
  bytes data = 4;
}

message RequestVote {
  uint64 last_log_index = 1;
  uint64 last_log_term = 2;
  bool pre_vote = 3;
}

message RequestVoteReply {
  uint64 request_term = 1;
  bool granted = 2;
  bool pre_vote = 3;
}

message AppendEntries {
  uint64 prev_log_index = 1;
  uint64 prev_log_term = 2;
  repeated Entry entries = 3;
  uint64 leader_commit = 4;
  uint64 read_seq = 5;
}

message AppendEntriesReply {
  bool success = 1;
  uint64 match_index = 2;
  uint64 conflict_index = 3;
  uint64 conflict_term = 4;
  uint64 read_seq = 5;
}

message InstallSnapshot {
  uint64 last_included_index = 1;
  uint64 last_included_term = 2;
  bytes data = 3;
  uint64 read_seq = 4;
}

message Envelope {
  string cluster_id = 1;  // messages from another cluster are rejected
  string from = 2;
  string to = 3;          // must name the receiving node
  uint64 term = 4;
  oneof body {
    RequestVote request_vote = 10;
    RequestVoteReply request_vote_reply = 11;
    AppendEntries append_entries = 12;
    AppendEntriesReply append_entries_reply = 13;
    InstallSnapshot install_snapshot = 14;
  }
}

message Ack {}

service RaftTransport {
  rpc Deliver(Envelope) returns (Ack);
}
